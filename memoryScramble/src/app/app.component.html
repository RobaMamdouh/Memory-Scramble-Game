<ng-container *ngIf="state$ | async as state">

  <app-config *ngIf="state.status === GameStatus.IDLE"></app-config>

  <div class="game-wrapper" *ngIf="state.status === GameStatus.PLAYING || state.status === GameStatus.WON || state.status === GameStatus.LOST">
    <app-hud [state]="state" (restart)="onRestart()"></app-hud>
    <app-board [state]="state" (cardFlipped)="onCardFlipped($event)"></app-board>
  </div>

  <app-game-over
    *ngIf="state.status === GameStatus.WON || state.status === GameStatus.LOST"
    [state]="state"
    (playAgain)="onPlayAgain()"
  ></app-game-over>

</ng-container>
